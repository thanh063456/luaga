<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>FB Job Poster Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 380px;
      min-height: 480px;
      max-height: 580px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #6366f1;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 600;
    }
    .content {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }
    .draft-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .draft-card:hover {
      border-color: #6366f1;
    }
    .draft-title {
      font-weight: 600;
      font-size: 13px;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .draft-group {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .draft-preview {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      max-height: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.2);
      padding: 6px 8px;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-secondary { background: #334155; color: #f1f5f9; }
    .btn-success { background: #10b981; color: white; }
    .status-bar {
      padding: 8px 14px;
      background: #1e293b;
      border-top: 1px solid #334155;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: #94a3b8;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>📣</span> FB Poster Assistant
    </div>
    <span class="badge" id="statusBadge">Local Connected</span>
  </div>

  <div class="content" id="draftList">
    <div class="empty-state">Đang tải bản nháp từ FB Job Poster...</div>
  </div>

  <div class="status-bar">
    <span id="tabStatus">Kiểm tra Facebook...</span>
    <button class="btn btn-secondary" id="btnRefresh" style="flex: none; padding: 4px 8px;">🔄 Làm mới</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
